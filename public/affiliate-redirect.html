<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentAPog - Redirecting...</title>
    <script>
        // Get the referral code from URL
        const pathname = window.location.pathname;
        const refMatch = pathname.match(/^\/(?:ref|aff)\/([^/]+)/);
        
        if (refMatch && refMatch[1]) {
            const code = refMatch[1];
            // Store in localStorage
            localStorage.setItem("referralCode", code);
        }
        
        // Redirect to home
        window.location.href = "/";
    </script>
</head>
<body style="margin: 0; padding: 0; background: linear-gradient(135deg, #fef2f2 0%, #eff6ff 100%); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <div style="text-align: center;">
        <h1 style="color: #dc2626; font-size: 48px; margin: 0 0 20px 0;">RentAPog</h1>
        <p style="color: #666; font-size: 20px; margin: 0;">Redirecting you...</p>
    </div>
</body>
</html>
